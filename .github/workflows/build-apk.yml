name: Build APK

# 触发方式：
#   1. 手动触发（本仓库页面 Actions -> Build APK -> Run workflow）
#   2. 推送到 main/master 分支
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'worknotes/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------- 安装系统依赖（buildozer / p4a 必需）----------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libtool \
            autoconf \
            automake \
            cmake \
            ninja-build \
            pkg-config

      # ---------- 安装 buildozer + Cython ----------
      - name: Install buildozer and cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      # ---------- 构建 APK（核心步骤）----------
      - name: Build release APK with buildozer
        working-directory: worknotes
        run: |
          buildozer -v android release 2>&1 | tee build.log
          ls -la bin/ || (echo "---- bin dir empty ----" && exit 1)

      # ---------- 校验产物 ----------
      - name: Verify APK
        working-directory: worknotes
        run: |
          APK=$(find bin -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK produced"
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK_NAME=$(basename "$APK")" >> $GITHUB_ENV
          ls -la "$APK"

      # ---------- 上传 APK 到本仓库 Actions 页面 ----------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: worknotes-apk
          path: worknotes/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------- 上传构建日志（失败时排错用）----------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: worknotes/build.log
          retention-days: 7
          if-no-files-found: warn
